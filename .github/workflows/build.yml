name: Build Aura Store APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ekstrak project AURA STORE
        run: |
          unzip -o AuraStore-fixed-build.zip -d aura-project

      - name: Cari folder Gradle
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/aura-project" -type f -name "settings.gradle.kts" -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Project Gradle tidak ditemukan"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project ditemukan di: $PROJECT_DIR"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Store-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
